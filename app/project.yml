name: HDZap
options:
  bundleIdPrefix: sh.saqoo
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "20"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: VCFY2GFR89
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HDZap:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - HDZap
    dependencies:
      # watchOS companion — xcodegen embeds it via "Embed Watch Content".
      - target: HDZapWatch
    info:
      path: HDZap/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "Connect to the OSD bridge device via Bluetooth"
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - bluetooth-central
        CFBundleDisplayName: HDZap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: YES
        UILaunchScreen: {}
  # Companion app that streams live heart rate from an HKWorkoutSession to
  # the phone over WatchConnectivity (see WatchHeartRateManager on iOS).
  # Bundle id MUST stay `<iOS bundle id>.watchkitapp` and
  # WKCompanionAppBundleIdentifier MUST match the iOS bundle id, or the
  # watch app won't install alongside HDZap.
  HDZapWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.saqoo.HDZap.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    sources:
      - HDZapWatch
    entitlements:
      path: HDZapWatch/HDZapWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: HDZapWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: sh.saqoo.HDZap
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "Read your heart rate during flight sessions so each race can be saved with it."
        NSHealthUpdateUsageDescription: "Save each flight session as a workout."
        CFBundleDisplayName: HDZap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
schemes:
  HDZap:
    build:
      targets:
        HDZap: all
    # No `storeKitConfiguration` here on purpose: local-StoreKit transactions are
    # signed with a Xcode-only key that fails Apple Root CA G3 verification on the
    # `hdzap-premium` Worker, so the JWS auth path can't be exercised end-to-end.
    # Default to Sandbox in every local Debug run — same flow TestFlight testers see,
    # one Sandbox Apple Account setup buys all subsequent runs. Keep the `.storekit`
    # file in `HDZap/Resources/StoreKit/` so we can flip back via Xcode → Edit Scheme
    # → Run → Options → StoreKit Configuration on the rare day local fake
    # transactions are useful (paywall layout iteration without sandbox round-trip).
